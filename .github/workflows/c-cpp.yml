name: Build rtl8188eu

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Kernel Source
      run: |
        git clone --depth=1 -b android-7.0 https://github.com/exynos7870/android_kernel_samsung_exynos7870.git kernel_src

    - name: Build driver
      run: |
        make ARCH=arm CROSS_COMPILE=arm-linux-androideabi- KSRC=$GITHUB_WORKSPACE/kernel_src modules
